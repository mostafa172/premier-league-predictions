<div class="app-container">
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="navbar__inner">
      <div class="topbar">
        <a class="nav-brand" [routerLink]="isLoggedIn ? '/predictions' : '/auth'" aria-label="PL Predictions home">
          <span class="brand-mark" aria-hidden="true">
            <i class="fa-solid fa-bolt"></i>
          </span>
          <span class="brand-copy">
            <span class="brand-kicker">Match Day</span>
            <span class="brand-name">PL Predictions</span>
          </span>
        </a>

        <div class="nav-user">
          <ng-container *ngIf="isLoggedIn; else loggedOut">
            <span class="account" *ngIf="currentUser">
              <span class="account-icon" aria-hidden="true">
                <i class="fa-solid fa-user"></i>
              </span>
              <span class="account-copy">
                <span class="account-label">Signed in as</span>
                <span class="username">{{ currentUser.username }}</span>
              </span>
            </span>
            <button
              type="button"
              class="icon-btn logout"
              (click)="logout()"
              aria-label="Log out"
              title="Log out"
            >
              <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
            </button>
          </ng-container>

          <ng-template #loggedOut>
            <a routerLink="/auth" routerLinkActive="active" class="login-link">Sign in</a>
          </ng-template>
        </div>
      </div>

      <div class="nav-scroll" *ngIf="isLoggedIn">
        <div class="bar-tabs" aria-label="Primary">
          <a routerLink="/predictions" routerLinkActive="active" ariaCurrentWhenActive="page">
            <i class="fa-solid fa-chart-line" aria-hidden="true"></i>
            <span>Predictions</span>
          </a>
          <a routerLink="/leagues" routerLinkActive="active" ariaCurrentWhenActive="page">
            <i class="fa-solid fa-users" aria-hidden="true"></i>
            <span>Leagues</span>
          </a>
          <a routerLink="/leaderboard" routerLinkActive="active" ariaCurrentWhenActive="page">
            <i class="fa-solid fa-trophy" aria-hidden="true"></i>
            <span>Leaderboard</span>
          </a>
          <a routerLink="/fixtures" routerLinkActive="active" ariaCurrentWhenActive="page">
            <i class="fa-solid fa-futbol" aria-hidden="true"></i>
            <span>Fixtures</span>
          </a>
          <a
            *ngIf="isAdmin"
            routerLink="/admin/fixtures"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
          >
            <i class="fa-solid fa-gear" aria-hidden="true"></i>
            <span>Admin</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <app-loading *ngIf="isLoading"></app-loading>
</div>
